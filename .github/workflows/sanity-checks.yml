name: FINCORP sanity checks
on:
  push:
  pull_request:
jobs:
  sanity:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run static dataset and code checks
        run: python -m unittest discover -s Tests/tests -v
